<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Check live weather for any city, including temperature, wind, and current conditions."
    />
    <meta name="theme-color" content="#000000" />
    <title>Weather App</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☀️%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.openweathermap.org" />
    <link rel="dns-prefetch" href="https://api.openweathermap.org" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=11" />
  </head>
  <body>
    <main class="for-star">
      <div class="wrapper">
        <div class="shape shape-1" aria-hidden="true"></div>
        <div class="shape shape-2" aria-hidden="true"></div>
        <section class="container">
          <form class="search-container" id="search-form">
            <label class="sr-only" for="city">City name</label>
            <input
              type="text"
              id="city"
              name="city"
              placeholder="Enter a city name"
              value="mumbai"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button type="submit" id="search-btn">Search</button>
          </form>
          <div id="result" role="status" aria-live="polite"></div>
        </section>
        <div id="earth" aria-hidden="true"></div>
      </div>
    </main>
    <script src="key.js" defer></script>
    <script src="main.js?v=11" defer></script>
  </body>
</html>
