    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Weather App",
        "url": "https://omar-mohamed-fattouh.github.io/Weather-App/",
        "description": "Search any city for live weather: temperature, wind, rain, snow, and current sky conditions.",
        "applicationCategory": "WeatherApplication",
        "operatingSystem": "Any",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Omar Mohamed Fattouh"
        }
      }
    </script>
  </head>
  <body>
    <main class="for-star">
      <h1 class="sr-only">Weather App</h1>
      <div class="wrapper">
        <div class="shape shape-1" aria-hidden="true"></div>
        <div class="shape shape-2" aria-hidden="true"></div>
        <section class="container">
          <form class="search-container" id="search-form">
            <label class="sr-only" for="city">City name</label>
            <input
              type="text"
              id="city"
              name="city"
              placeholder="Enter a city name"
              value="mumbai"
              autocomplete="off"
              spellcheck="false"
              enterkeyhint="search"
            />
            <button type="submit" id="search-btn">Search</button>
          </form>
          <div id="result" role="status" aria-live="polite"></div>
        </section>
        <div id="earth" aria-hidden="true"></div>
      </div>
    </main>
    <script src="key.js" defer></script>
    <script src="main.js?v=13" defer></script>
  </body>
